{% extends 'base.html' %}{% block title %}Nouveau mot de passe{% endblock %}{% block content %}<section class="auth-layout"><div class="auth-card"><h1>Nouveau mot de passe</h1>{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-warning w-100" type="submit">Enregistrer</button></form>{% else %}<div class="alert alert-danger">Ce lien n'est plus valide.</div><a class="btn btn-dark" href="{% url 'accounts:password_reset' %}">Demander un nouveau lien</a>{% endif %}</div></section>{% endblock %}
